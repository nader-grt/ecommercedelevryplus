services:

  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: ecommerce-api

    ports:
      - "4000:4000"

    env_file:
      - .env.docker

    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.11

    container_name: ecommerce-mariadb

    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: ecommercedelevry

    ports:
      - "3308:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: